name: Build mods

# Manual only — intentionally not triggered on push/PR. See CONTRIBUTING.md:
# build the mod locally before opening a PR; this workflow is for producing
# real build artifacts on demand (e.g. ahead of a release), not CI-on-every-commit.
on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft version to build (matches a Stonecutter version dir prefix under apps/mod/versions, e.g. 1.21.1). Leave blank to build all."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build mod jars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # This is just the JDK that launches Gradle itself -- each
          # subproject (1.21.1 needs 21, the 1.19.2/1.20.1 Forge targets need
          # 17) gets its own compile JDK auto-provisioned via
          # org.gradle.toolchains.foojay-resolver-convention regardless of
          # this value, confirmed working locally across all four targets.
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: apps/mod
        run: |
          if [ -n "${{ inputs.minecraft_version }}" ]; then
            projects=$(ls versions | grep "^${{ inputs.minecraft_version }}-")
            if [ -z "$projects" ]; then
              echo "No Stonecutter version dir matches '${{ inputs.minecraft_version }}' under versions/" >&2
              exit 1
            fi
            tasks=$(for p in $projects; do echo -n ":$p:build "; done)
            ./gradlew $tasks --stacktrace
          else
            ./gradlew build --stacktrace
          fi

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: smartmc-${{ inputs.minecraft_version || 'all' }}
          path: apps/mod/versions/*/build/libs/*.jar
          if-no-files-found: warn
