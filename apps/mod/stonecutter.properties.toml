# NOTE on version coverage: the original plan called for a 1.20.1 floor
# version across all three loaders. That's not actually possible --
# NeoForge has no build for 1.20.1 at all; its earliest release (20.2.x)
# targets Minecraft 1.20.2 (confirmed against maven.neoforged.net's
# metadata during M0). 1.21.1 is the only version targeted for now,
# since it's also the real dogfooding environment (the Opolis modpack).
# Revisit the actual floor version in M3 when expanding version coverage.

# NOTE on loaders: classic Forge is NOT a build target. The
# `net.neoforged.moddev.legacyforge` plugin (the bridge that would let this
# Stonecutter/ModDevGradle-family setup target classic Forge) only supports
# Minecraft 1.17-1.20.1 -- confirmed against its own docs, and against the
# fact that upstream rotgruengelb/stonecutter-mod-template itself caps its
# own Forge entry at 1.19.2 while Fabric/NeoForge go much further. Modern
# Forge (1.21.x) only builds via the separate, unrelated ForgeGradle
# toolchain, which is a real second Gradle plugin ecosystem, not a config
# tweak here. Decision: drop Forge from v1 rather than adopt a second
# toolchain for one loader.
#
# Quilt fills the third-loader slot instead, at zero extra build cost: Quilt
# has a built-in Fabric-compatibility layer, so the `fabric` target's jar
# already runs unmodified on a Quilt server. No separate Stonecutter target,
# no quilt.mod.json, no new Gradle plugin. If a future feature needs Fabric
# API specifically, Quilt users install the drop-in-compatible "Quilted
# Fabric API" instead -- that's a player/server-owner install-time concern,
# not something requiring a separate build here.

[fabric]
deps.fabric-loader = "0.19.3"

[fabric."1.21.1"]
deps.minecraft = "1.21.1"
deps.fabric-api = "0.116.7+1.21.1"

[neoforge]

[neoforge."1.21.1"]
deps.minecraft = "1.21.1"
deps.neoforge = "21.1.213"
